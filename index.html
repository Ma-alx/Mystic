  if(GH.id)await ghApi('/gists/'+GH.id,{method:'PATCH',body});else{const g=await ghApi('/gists',{method:'POST',body:JSON.stringify({description:GHD,public:false,files:JSON.parse(body).files})});GH.id=g.id;localStorage.setItem('mx_ghid',g.id)}
  GH.last=Date.now();GH.dirty=false;GH.ok=true;GH.msg='';localStorage.setItem('mx_ghts',GH.last);return true}catch(e){if(!GH.msg)GH.msg='keine Verbindung';return false}finally{GH.busy=false}}
async function ghCheck(ask){if(!GH.tok)return;try{const g=await ghFind();GH.ok=true;GH.msg='';const d=await ghRead(g);if(!d||!d.s){GH.hold=false;return}const rt=saveTs(d.s),lt=saveTs(allSaves());if(rt>lt+60000){if(ask!==false)ghAsk(d);return d}GH.hold=false}catch(e){GH.ok=false;if(!GH.msg)GH.msg='keine Verbindung'}}
function ghAsk(d){const fresh=!saveTs(allSaves());$('mb2').innerHTML=`<h2>☁ Spielstand in GitHub</h2><p class='hint'>In deiner GitHub-Cloud liegt ein ${fresh?'':'neuerer '}Spielstand vom <b>${fmtD(saveTs(d.s))}</b>.${fresh?'':' Dein Stand auf diesem Gerät ist älter.'}</p><button class='p' style='width:100%' onclick='ghTake()'>Cloud-Stand laden</button><button style='width:100%;margin-top:6px' onclick='ghKeep()'>${fresh?'Neu anfangen':'Diesen Gerätestand behalten'}</button>`;GH.pend=d;$('modal2').style.display='flex'}
function ghTake(){try{putSaves(GH.pend.s);localStorage.setItem('mx_ghts',Date.now());closeW2();location.reload()}catch(e){toast('Laden fehlgeschlagen','#ff6b6b')}}
function ghKeep(){GH.hold=false;GH.pend=null;closeW2();ghPush(true)}
function ghSoon(){GH.dirty=true}
async function ghConnect(){const t=($('ght').value||'').trim();if(!t){$('ghm').textContent='Bitte Schlüssel einfügen.';return}GH.tok=t;GH.id='';GH.msg='';$('ghm').textContent='Verbinde…';try{await ghApi('/gists?per_page=1');localStorage.setItem('mx_gh',t);const d=await ghCheck(false);if(d){ghAsk(d);return}GH.hold=false;await ghPush(true);ghWin()}catch(e){GH.tok='';$('ghm').textContent='✗ '+(GH.msg||'Verbindung fehlgeschlagen')}}
function ghOff(){if(!confirm('GitHub-Cloud auf diesem Gerät trennen? Dein Stand in GitHub bleibt erhalten.'))return;GH.tok='';GH.id='';GH.ok=false;try{localStorage.removeItem('mx_gh');localStorage.removeItem('mx_ghid')}catch(e){}ghWin()}
async function ghBtn(a){const e=$('ghm');if(e)e.textContent=a==='push'?'Sichere…':'Lade…';if(a==='push'){const ok=await ghPush(true);if(e)e.textContent=ok?'✓ Gesichert':'✗ '+(GH.msg||'fehlgeschlagen')}else{const d=await ghCheck(false);try{const g=d||await ghRead(await ghFind());if(!g){if(e)e.textContent='Noch kein Stand in GitHub.';return}ghAsk(g)}catch(x){if(e)e.textContent='✗ '+(GH.msg||'fehlgeschlagen')}}}
function ghWin(){let h=`<h2>☁ GitHub-Cloud</h2>`;
 if(!GH.tok)h+=`<p class='hint'>Dein Spielstand wird automatisch in einem <b>privaten Gist</b> in deinem GitHub-Konto gesichert. So geht nach dem Löschen der App nichts verloren.</p><ol class='hint' style='padding-left:18px;margin:6px 0'><li><a href='https://github.com/settings/tokens/new?scopes=gist&description=Mystic%20Spielstand' target='_blank' style='color:#9be7ff'>Diesen Link öffnen</a> und bei GitHub anmelden</li><li>Bei „Expiration“ <b>No expiration</b> wählen, unten auf <b>Generate token</b> tippen</li><li>Den Schlüssel (beginnt mit <b>ghp_</b>) kopieren, hier einfügen und in der Passwörter-App speichern</li></ol><input id='ght' type='password' autocomplete='off' placeholder='ghp_…' style='width:100%;padding:8px;font-size:14px;background:#0d1020;color:#cfd8ff;border:1px solid #4a5a8a;border-radius:6px'><button class='p' style='width:100%;margin-top:6px' onclick='ghConnect()'>Verbinden</button>`;
 else h+=`<div class='sd'><div class='st'><span>Status</span><b style='color:${GH.ok?'#3ddc5a':'#ffb070'}'>${GH.ok?'✓ verbunden':'⚠ '+(GH.msg||'nicht erreichbar')}</b></div><div class='st'><span>Letzte Sicherung</span><b>${GH.last?fmtD(GH.last):'–'}</b></div></div><p class='hint'>Wird automatisch alle paar Minuten und beim Schließen der App gesichert.</p><button class='p' style='width:100%' onclick="ghBtn('push')">Jetzt sichern</button><button style='width:100%;margin-top:6px' onclick="ghBtn('load')">Aus GitHub laden</button><button style='width:100%;margin-top:6px' onclick='ghOff()'>Trennen</button>`;
 h+=`<p class='hint' id='ghm'></p><h2 style='margin-top:12px'>📁 Datei (iCloud)</h2><button style='width:100%' onclick='fileExp()'>Als Datei sichern</button><button style='width:100%;margin-top:6px' onclick='fileImpPick()'>Aus Datei laden</button><p class='hint' id='flm'></p><button style='width:100%;margin-top:10px' onclick='closeW2()'>Schließen</button>`;
 $('mb2').innerHTML=h;$('modal2').style.display='flex'}
async function fileExp(){try{save()}catch(e){}const o=allSaves(),d=new Date(),nm='Mystic-Spielstand-'+d.toISOString().slice(0,10)+'.json',js=JSON.stringify({v:1,ts:Date.now(),s:o});const m=$('flm');
 try{const f=new File([js],nm,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Mystic Spielstand'});if(m)m.textContent='Tipp: „In Dateien sichern“ → iCloud Drive wählen.';S.bkAt=Date.now();return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([js],{type:'application/json'}));a.download=nm;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);try{S.bkAt=Date.now()}catch(e){}if(m)m.textContent='Datei gespeichert: '+nm}
function fileImpPick(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json,text/plain';i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const m=$('flm');try{const d=JSON.parse(r.result);if(!confirm('Spielstand aus Datei laden? Das überschreibt deine aktuellen Spielstände.'))return;putSaves(d.s||d);if(m)m.textContent='Geladen – starte neu…';GH.hold=false;setTimeout(()=>location.reload(),500)}catch(e){if(m)m.textContent='Diese Datei ist kein gültiger Spielstand.'}};r.readAsText(f)};i.click()}
if(GH.tok)setTimeout(()=>ghCheck(),1500);else GH.hold=false;
setInterval(()=>{try{if(GH.tok&&!GH.hold&&GH.dirty&&Date.now()-GH.last>180000)ghPush()}catch(e){}},20000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)try{if(GH.tok&&!GH.hold&&GH.dirty)ghPush()}catch(e){}});

/* ---------- Speichern-Knopf ---------- */
async function saveNow(){try{save()}catch(e){}
 let h=`<h2>💾 Speichern</h2><div class='sd'><div class='st'><span>Auf diesem Gerät</span><b style='color:#3ddc5a'>✓ gespeichert ${new Date().toLocaleTimeString('de-DE')}</b></div>${CLD.ok?`<div class='st'><span>Cloud</span><b id='svc'>sichere…</b></div>`:''}<div class='st'><span>GitHub-Cloud</span><b id='svg' style='color:${GH.tok?'#cfd8ff':'#a39b8a'}'>${GH.tok?'sichere…':'nicht eingerichtet'}</b></div></div>`;
 h+=(CLD.ok||GH.tok)?'':`<p class='hint'>Richte die GitHub-Cloud ein, damit dein Spielstand auch nach dem Löschen der App erhalten bleibt – oder sichere ihn als Datei in iCloud.</p>`;
 h+=`<button class='p' style='width:100%' onclick='ghWin()'>☁ GitHub-Cloud ${GH.tok?'verwalten':'einrichten'}</button><button style='width:100%;margin-top:6px' onclick='fileExp()'>📁 Als Datei sichern (iCloud)</button><button style='width:100%;margin-top:6px' onclick='bkWin()'>Backup-Code anzeigen</button><p class='hint' id='flm'></p><button style='width:100%;margin-top:6px' onclick='closeW2()'>Schließen</button>`;
 $('mb2').innerHTML=h;$('modal2').style.display='flex';
 if(GH.tok){ghPush(true).then(ok=>{const e=$('svg');if(e){e.textContent=ok?'✓ gesichert':'✗ '+(GH.msg||'fehlgeschlagen');e.style.color=ok?'#3ddc5a':'#ff6b6b'}})}
 if(CLD.ok){let ok=false;try{ok=await cloudPush(null,true)}catch(e){}const e=$('svc');if(e){e.textContent=ok?'✓ gesichert':'✗ fehlgeschlagen'+(CLD.msg?' ('+CLD.msg+')':'');e.style.color=ok?'#3ddc5a':'#ff6b6b'}}}
menu();retr();newsAuto();
try{const rk=sessionStorage.getItem('wa_resume');if(rk){sessionStorage.removeItem('wa_resume');setTimeout(()=>{try{go(true,rk)}catch(e){}},300)}}catch(e){}

(()=>{const fix=n=>{if(n.nodeType===3){const v=r2s(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}else if(n.childNodes)n.childNodes.forEach(fix)};const ob=new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')fix(m.target);else m.addedNodes.forEach(fix)}});['modal','modal2','log','sks','info','mb','mb2'].forEach(id=>{const e=document.getElementById(id);if(e)ob.observe(e,{childList:true,subtree:true,characterData:true})})})();
